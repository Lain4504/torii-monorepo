global
    log /dev/log    local0
    log /dev/log    local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Default SSL material locations
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    default-server init-addr last,libc,none

frontend frontend-http
    bind :80
    mode http
    # ACL for Let's Encrypt could be added here if needed
    http-request redirect scheme https

frontend ft_ssl
    mode tcp
    # HAProxy will take the certificate from /etc/haproxy/ssl/
    bind *:443 ssl crt /etc/haproxy/ssl/

    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # Pass TURN requests to LiveKit Turn server via SNI
    use_backend bk_livekit_turn if { ssl_fc_sni -i {{DOMAIN}} }

    default_backend bk_http_to_services

backend bk_livekit_turn
    mode tcp
    # Forward the raw TCP stream to the LiveKit server's TURNS port.
    # We use the service name 'livekit' defined in docker-compose
    server livekit livekit:5349 check send-proxy-v2

backend bk_http_to_services
    mode tcp
    server local 127.0.0.1:81 check send-proxy

frontend ft_services
    mode http
    bind *:81 accept-proxy

    acl livekit path_beg /livekit
    acl nats path_beg /ws
    
    use_backend bk_livekit_api if livekit
    use_backend bk_nats if nats

    # Default to Meet Gateway
    default_backend bk_meet_gateway

backend bk_meet_gateway
    mode http
    option forwardfor
    server gateway gateway:8080 check

backend bk_livekit_api
    mode http
    option forwardfor
    http-request set-path "%[path,regsub(^/livekit/,/)]"
    server livekit livekit:7880 check

backend bk_nats
    mode http
    option forwardfor
    option http-server-close
    timeout tunnel 1h
    http-request set-path "%[path,regsub(^/ws/,/)]"
    server nats nats:8222 check
