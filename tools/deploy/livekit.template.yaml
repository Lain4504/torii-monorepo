port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 60000
  tcp_port: 7881
  use_external_ip: true
  allow_tcp_fallback: true
redis:
  address: redis:6379
  username: ""
  password: ""
  db: 0
room:
  auto_create: true
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/h264
    - mime: video/vp8
    - mime: video/vp9
    - mime: video/av1
logging:
  level: warn
  sample: true
keys:
  {{LIVEKIT_API_KEY}}: {{LIVEKIT_API_SECRET}}
webhook:
  api_key: {{LIVEKIT_API_KEY}}
  urls:
    - "https://{{DOMAIN}}/webhook/livekit"
turn:
  enabled: true
  domain: {{DOMAIN}}
  external_tls: true
  tls_port: 5349
  udp_port: 443
