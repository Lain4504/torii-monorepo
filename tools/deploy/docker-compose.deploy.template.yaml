services:
  haproxy:
    image: haproxy:2.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./ssl:/etc/haproxy/ssl:ro
    depends_on:
      - gateway
      - livekit
    networks:
      - torii-network

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      # TURN ports are handled by HAProxy or mapped directly
      - "50000-60000:50000-60000/udp"
    environment:
      - LIVEKIT_KEYS={{LIVEKIT_API_KEY}}: {{LIVEKIT_API_SECRET}}
    depends_on:
      - redis
    networks:
      - torii-network

  gateway:
    image: {{DOCKER_IMAGE}}
    command: node apps/server/dist/modules/meet/src/main.js
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL={{DATABASE_URL}}
      - LIVEKIT_API_KEY={{LIVEKIT_API_KEY}}
      - LIVEKIT_API_SECRET={{LIVEKIT_API_SECRET}}
      - LIVEKIT_API_URL=http://livekit:7880
      - LIVEKIT_WS_URL=wss://{{DOMAIN}}/livekit
      - REDIS_HOST=redis
      - NATS_URL=nats://nats:4222
    depends_on:
      - redis
      - nats
    networks:
      - torii-network

  redis:
    image: redis:7-alpine
    networks:
      - torii-network

  nats:
    image: nats:2.10-alpine
    command: "-js"
    networks:
      - torii-network

networks:
  torii-network:
    driver: bridge
