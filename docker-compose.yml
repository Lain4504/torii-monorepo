services:
  # ========================================
  # Infrastructure Services
  # ========================================
  
  postgres:
    image: postgres:16-alpine
    container_name: torii-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: wajlc
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: torii-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.12-alpine
    container_name: torii-nats
    restart: always
    command:
      - "-DVV"
      - "-config"
      - "/nats-server.conf"
    ports:
      - "4222:4222/tcp" # clients
      - "8222:8222/tcp" # websockets
    volumes:
      - ./nats_server.conf:/nats-server.conf
      - natsdata:/data/jetstream

  livekit:
    image: livekit/livekit-server:latest
    container_name: torii-livekit
    restart: always
    command: --config /livekit.yaml
    ports:
      - '7880:7880'  # HTTP
      - '7881:7881'  # WebRTC over TCP
      - '7882:7882/udp'  # WebRTC over UDP
    volumes:
      - ./livekit.yaml:/livekit.yaml
      - livekitdata:/data
    depends_on:
      - redis


volumes:
  pgdata:
  redisdata:
  natsdata:
  livekitdata:
