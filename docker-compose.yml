services:
  # ========================================
  # Infrastructure Services
  # ========================================
  
  postgres:
    image: postgres:16-alpine
    container_name: torii-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: wajlc
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: torii-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.12-alpine
    container_name: torii-nats
    restart: always
    command:
      - "-DVV"
      - "-config"
      - "/nats-server.conf"
    ports:
      - "4222:4222/tcp" # clients
      - "8222:8222/tcp" # websockets
    volumes:
      - ./nats_server.conf:/nats-server.conf
      - natsdata:/data/jetstream

  livekit:
    image: livekit/livekit-server:latest
    container_name: torii-livekit
    restart: always
    command: --config /livekit.yaml
    ports:
      - '7880:7880'  # HTTP
      - '7881:7881'  # WebRTC over TCP
      - '7882:7882/udp'  # WebRTC over UDP
    volumes:
      - ./livekit.yaml:/livekit.yaml
      - livekitdata:/data
    depends_on:
      - redis

  # ========================================
  # Application Services
  # ========================================

  gateway:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: npm run prod:gateway
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IDENTITY_SERVICE_URL=http://identity:8081
      - LEARNING_SERVICE_URL=http://learning:8082
      - AGENTS_SERVICE_URL=http://agents:8090
      - MEET_SERVICE_URL=http://meet:8091
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - nats
      - postgres
      - redis
      - identity
      - learning
      - meet
      - agents

  identity:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: npm run prod:identity
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nats
      - postgres
      - redis

  learning:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: npm run prod:learning
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nats
      - postgres
      - redis

  meet:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: npm run prod:meet
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nats
      - postgres
      - redis

  agents:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: npm run prod:agents
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nats
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
  natsdata:
  livekitdata:
