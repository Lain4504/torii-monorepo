services:
  # ========================================
  # Infrastructure Services
  # ========================================
  
  postgres:
    image: postgres:16-alpine
    container_name: torii-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: wajlc
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: torii-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.12-alpine
    container_name: torii-nats
    restart: always
    command:
      - "-DVV"
      - "-config"
      - "/nats-server.conf"
    ports:
      - "4222:4222/tcp" # clients
      - "8222:8222/tcp" # websockets
    volumes:
      - ./nats_server.conf:/nats-server.conf
      - natsdata:/data/jetstream

  livekit:
    image: livekit/livekit-server:latest
    container_name: torii-livekit
    restart: always
    command: --config /livekit.yaml
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
#      - '5349:5349' # TURN TLS
#      - '443:443/udp' # TURN UDP (Fix for 4G)
#      - '50000-50100:50000-50100/udp' # Media range (100 ports)
    volumes:
      - ./livekit.yaml:/livekit.yaml
      - livekitdata:/data
#      - ./certs:/certs:ro
    depends_on:
      - redis

  livekit-ingress:
    image: livekit/ingress:latest
    container_name: torii-livekit-ingress
    restart: always
    command: --config /ingress.yaml
    ports:
      - '1935:1935/tcp'   # RTMP
      - '8089:8089/tcp'   # WHIP
    volumes:
      - ./ingress.yaml:/ingress.yaml
    depends_on:
      - redis
      - livekit

  # ========================================
  # Application Services
  # ========================================
  # NOTE: Using pre-built image from Docker Hub to save VPS disk space
  # Image name is configured via DOCKER_USERNAME in .env

  gateway:
    image: ${DOCKER_USERNAME}/torii-backend:latest
    command: npm run prod:gateway
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IDENTITY_SERVICE_URL=http://identity:8081
      - LEARNING_SERVICE_URL=http://learning:8082
      - AGENTS_SERVICE_URL=http://agents:8090
      - MEET_SERVICE_URL=http://meet:8091
      - BILLING_SERVICE_URL=http://billing:8084
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - nats
      - postgres
      - redis
      - identity
      - learning
      - meet
      - agents
      - billing

  identity:
    image: ${DOCKER_USERNAME}/torii-backend:latest
    command: npm run prod:identity
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nats
      - postgres
      - redis

  learning:
    image: ${DOCKER_USERNAME}/torii-backend:latest
    command: npm run prod:learning
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nats
      - postgres
      - redis

  meet:
    image: ${DOCKER_USERNAME}/torii-backend:latest
    command: npm run prod:meet
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nats
      - postgres
      - redis

  agents:
    image: ${DOCKER_USERNAME}/torii-backend:latest
    command: npm run prod:agents
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FASTMCP_URL=http://mcp-server:3333
    depends_on:
      - nats
      - postgres
      - redis
      - mcp-server

  mcp-server:
    build:
      context: ./apps/server/modules/agents
      dockerfile: mcp-server/Dockerfile
    container_name: torii-mcp
    restart: always
    command: npm run start:prod
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3333
    ports:
      - "3333:3333"

  gamification:
    image: ${DOCKER_USERNAME}/torii-backend:latest
    command: npm run prod:gamification
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nats
      - postgres
      - redis

  communication:
    image: ${DOCKER_USERNAME}/torii-backend:latest
    command: npm run prod:communication
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nats
      - postgres
      - redis

  storage:
    image: ${DOCKER_USERNAME}/torii-backend:latest
    command: npm run prod:storage
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nats
      - postgres
      - redis

  billing:
    image: ${DOCKER_USERNAME}/torii-backend:latest
    command: npm run prod:billing
    restart: always
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://postgres:123456789@postgres:5432/wajlc
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BILLING_HTTP_PORT=8084
    depends_on:
      - nats
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
  natsdata:
  livekitdata:
