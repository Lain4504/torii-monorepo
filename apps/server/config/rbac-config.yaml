# ============================================
# RBAC Configuration
# ============================================
# Version: 3.0.0 - Academy Centric RBAC
# 
# Design Philosophy:
# - Updated to match Academy microservice structure
# - Standardized academic content, commerce, and delivery permissions
# - Full compatibility with latest gateway backend controllers
# - Actors: admin, staff-academic, staff-operations, lecturer, learner

system:
  version: "3.0.0"
  description: "Role-Based Access Control updated for Academy Module"

# ============================================
# Roles Definition
# ============================================
roles:
  - code: admin
    name: System Administrator
    description: Full access to all system resources
    
  - code: staff-academic
    name: Academic Staff
    description: Academic operations, content and delivery management
    
  - code: staff-operations
    name: Operations Staff
    description: Business operations, support, finance, and marketing
    
  - code: lecturer
    name: Instructor
    description: Teaching staff managing assigned classes and students
    
  - code: learner
    name: Student
    description: Standard student access (no admin permissions)

# ============================================
# Permissions Definition
# ============================================
permissions:
  # Academy Content (Courses, Profiles, Lessons, Chapters)
  - code: academy.content.read
    description: View academic content details
    category: Academy Content
  - code: academy.content.write
    description: Create and manage academic content
    category: Academy Content
  - code: academy.content.approve
    description: Approve or reject academic content publishing
    category: Academy Content

  # Academy Delivery (Classes, Schedules, Attendance)
  - code: academy.delivery.read
    description: View class information and schedules
    category: Academy Delivery
  - code: academy.delivery.write
    description: Manage classes, schedules and marking attendance
    category: Academy Delivery
  - code: academy.delivery.approve
    description: Approve or reject delivery lifecycle requests
    category: Academy Delivery

  # Academy Commerce (Offerings, Orders, Coupons)
  - code: academy.commerce.read
    description: View course offerings and financial data
    category: Academy Commerce
  - code: academy.commerce.write
    description: Manage course offerings and pricing
    category: Academy Commerce
  - code: academy.commerce.approve
    description: Approve or reject offering publishing
    category: Academy Commerce
  - code: academy:order:admin
    description: Full access to order management and billing
    category: Academy Commerce
  - code: academy:coupon:admin
    description: Full access to coupon creation and validation
    category: Academy Commerce

  # Assessment & Exams
  - code: exam.manage
    description: Create and manage exams and questions
    category: Academy Assessment
  - code: submission.grade
    description: Grade student submissions and exams
    category: Academy Assessment

  # Gamification
  - code: gamification.manage
    description: Manage reward shop and point configurations
    category: Gamification

  # AI Subscription (Sensei)
  - code: academy:subscription:admin
    description: Manage AI sensei subscription plans and users
    category: Academy Commerce

  # Blog Management
  - code: blog.view_restricted
    description: View private/draft blog posts
    category: Blog
  - code: blog.manage
    description: Full access to blog management (Super Mod)
    category: Blog
  - code: blog.create
    description: Create new blog posts
    category: Blog
  - code: blog.update
    description: Update existing blog posts
    category: Blog
  - code: blog.delete
    description: Delete blog posts
    category: Blog
  - code: blog.publish
    description: Publish blog posts
    category: Blog

  # Customer Support
  - code: support.view
    description: View support tickets and inquiries
    category: Support
  - code: support.handle
    description: Resolve support tickets and respond to users
    category: Support

  # User Management
  - code: user.view
    description: View user profiles and basic data
    category: User Management
  - code: user.manage
    description: Create, edit, and deactivate users
    category: User Management

  # System & Analytics
  - code: report.view
    description: View system analytics and revenue reports
    category: Analytics
  - code: audit.view
    description: View system audit logs
    category: System
  - code: system.config
    description: Global system configuration
    category: System

# ============================================
# Default Role Permissions
# ============================================
default_role_permissions:
  # Admin: Full access
  admin:
    - "*"
    
  # Staff-Academic: Academic operations & Content
  staff-academic:
    - user.view
    - academy.content.read
    - academy.content.write
    - academy.content.approve
    - academy.delivery.read
    - academy.delivery.write
    - academy.delivery.approve
    - academy.commerce.read # Limited view of packages
    - exam.manage
    - report.view
    
  # Staff-Operations: Support, Business, and Finance
  staff-operations:
    - user.view
    - report.view
    - audit.view
    - academy.content.read
    - academy.delivery.read
    - academy.commerce.read
    - academy.commerce.write
    - academy.commerce.approve
    - academy:order:admin
    - academy:coupon:admin
    - academy:subscription:admin
    - gamification.manage
    - blog.manage
    - blog.create
    - blog.update
    - blog.publish
    - blog.delete
    - blog.view_restricted
    - support.view
    - support.handle
    
  # Lecturer: Managing their own classes and students
  lecturer:
    - academy.content.read
    - academy.delivery.read
    - academy.delivery.write
    - exam.manage
    - submission.grade
    
  # Learner: access learner-facing academy flows
  learner:
    - academy.content.read
    - academy.delivery.read
