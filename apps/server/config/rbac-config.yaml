# ============================================
# RBAC Configuration
# ============================================
# Version: 2.0.0 - Editable RBAC with Role Inheritance
# 
# Design Philosophy:
# - 4 Main Actors: Admin, Staff, Lecturer, Learner
# - Staff has 3 variants (LMS, Support, Sales) via inheritance
# - Permissions are editable via admin UI
# - This YAML is the source of truth for role & permission definitions

system:
  version: "2.0.0"
  description: "Role-Based Access Control with inheritance support"

# ============================================
# Roles Definition
# ============================================
# Main actors + Staff variants (4 actors total)
roles:
  # Main Actor 1: System Administrator
  - code: admin
    name: System Administrator
    description: Full access to all system resources
    
  # Staff Variant 1: LMS/Academic Staff
  - code: staff-lms
    name: LMS Staff
    description: Learning Management & Academic Operations staff
    
  # Staff Variant 2: Support Staff
  - code: staff-support
    name: Support Staff
    description: Customer support and general inquiries
    
  # Staff Variant 3: Sales/Marketing Staff
  - code: staff-sales
    name: Sales Staff
    description: Sales, marketing, and business development
    
  # Staff Variant 4: Finance Staff
  - code: staff-finance
    name: Finance Staff
    description: Financial operations, payments, and coupons
    
  # Main Actor 3: Lecturer
  - code: lecturer
    name: Instructor
    description: Teaching staff managing classes and students
    
  # Main Actor 4: Learner
  - code: learner
    name: Student
    description: Students enrolled in courses (no admin access)

# ============================================
# Permissions Definition
# ============================================
# All available permissions grouped by category
permissions:
  # Course Management
  - code: course.view_restricted
    description: View course list (non-public courses)
    category: Course Management
  - code: course.create
    description: Create new courses
    category: Course Management
  - code: course.update
    description: Edit course details
    category: Course Management
  - code: course.publish
    description: Publish/unpublish courses
    category: Course Management
  - code: course.view_my
    description: View own courses
    category: Course Management
  - code: module.create
    description: Create course modules
    category: Course Management
  - code: module.update
    description: Edit course modules
    category: Course Management
  - code: module.delete
    description: Delete course modules
    category: Course Management
  - code: lesson.create
    description: Create course lessons
    category: Course Management
  - code: lesson.update
    description: Edit course lessons
    category: Course Management
  - code: lesson.delete
    description: Delete course lessons
    category: Course Management
    
  # Class Management
  - code: live_class.schedule
    description: Schedule live classes
    category: Class Management
  - code: live_class.manage
    description: Manage live class sessions
    category: Class Management
  - code: class_member.view
    description: View class member lists
    category: Class Management
  - code: attendance.view
    description: View attendance records
    category: Class Management
  - code: attendance.mark
    description: Mark student attendance
    category: Class Management
  - code: schedule.view
    description: View class schedules
    category: Class Management

  # Assessment
  - code: exam.manage
    description: Create and manage exams
    category: Assessment
  - code: assignment.create
    description: Create assignments
    category: Assessment
  - code: assignment.manage
    description: Manage assignments
    category: Assessment
  - code: assignment.update
    description: Update assignments
    category: Assessment
  - code: assignment.publish
    description: Publish assignments
    category: Assessment
  - code: assignment.delete
    description: Delete assignments
    category: Assessment
  - code: submission.grade
    description: Grade student submissions
    category: Assessment
    
  # Content Management
  - code: material.upload
    description: Upload learning materials
    category: Content Management
  - code: material.view
    description: View learning materials
    category: Content Management
  - code: blog.write
    description: Write blog posts
    category: Content Management
  - code: blog.manage
    description: Manage all blog posts
    category: Content Management
  - code: tag.manage
    description: Manage content tags
    category: Content Management
    
  # User Management
  - code: user.view
    description: View user profiles
    category: User Management
  - code: user.manage
    description: Create, edit, delete users
    category: User Management
    
  # Payment & Finance
  - code: payment.view
    description: View payment records
    category: Payment & Finance
  - code: payment.refund
    description: Process refunds
    category: Payment & Finance
  - code: coupon.manage
    description: Create and manage coupons
    category: Payment & Finance
    
  # Customer Support
  - code: support.handle
    description: Handle support tickets and refunds
    category: Customer Support
    
  # Analytics
  - code: report.view
    description: View analytics and reports
    category: Analytics
    
  # System
  - code: system.config
    description: Configure system settings
    category: System
  - code: ai.config
    description: Configure AI features
    category: System
  - code: audit.view
    description: View system audit logs
    category: System

# ============================================
# Default Role Permissions
# ============================================
# Permissions seeded on first startup
# Can be edited via admin UI afterward
default_role_permissions:
  # Admin: Full access
  admin:
    - "*"  # Wildcard - all permissions
    
  # Staff-LMS: Academic operations
  staff-lms:
    - user.view
    - blog.write
    - report.view
    - audit.view
    - course.create
    - course.update
    - course.publish
    - module.create
    - module.update
    - module.delete
    - lesson.create
    - lesson.update
    - lesson.delete
    - exam.manage
    - live_class.schedule
    - class_member.view
    - attendance.view
    - assignment.manage
    - assignment.update
    - assignment.publish
    - assignment.delete
    - material.upload
    - material.view
    - blog.manage
    - tag.manage
    - course.view_restricted
    
  # Staff-Support: Customer support
  staff-support:
    - user.view
    - blog.write
    - report.view
    - audit.view
    - user.manage
    - payment.view
    - course.view_restricted
    - support.handle
    
  # Staff-Finance: Financial operations
  staff-finance:
    - user.view
    - blog.write
    - report.view
    - audit.view
    - payment.view
    - payment.refund
    - coupon.manage

  # Staff-Sales: Sales & Marketing (inherits staff + adds more)
  staff-sales:
    - user.view
    - blog.write
    - report.view
    - audit.view
    - payment.view
    - coupon.manage
    - blog.manage
    - tag.manage
    
  # Lecturer: Teaching permissions
  lecturer:
    - live_class.manage
    - class_member.view
    - attendance.view
    - attendance.mark
    - assignment.create
    - assignment.manage
    - assignment.update
    - assignment.publish
    - assignment.delete
    - submission.grade
    - material.upload
    - material.view
    - schedule.view
    - course.create
    - course.update
    - module.update
    - lesson.create
    - lesson.update
    - lesson.delete
    - course.view_my
    
  # Learner: No admin permissions
  learner: []
