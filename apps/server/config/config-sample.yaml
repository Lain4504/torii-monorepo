# Torii Server Sample Configuration

server:
  port: 8080
  apiUrl: "http://localhost:8080"
  uploadPath: "./uploads"
  storagePath: "./storage"
  nodeEnv: "development"

database:
  url: "postgresql://user:pass@localhost:5432/dbname"

redis:
  host: "localhost"
  port: 6379
  password: ""

nats:
  url: "nats://localhost:4222"
  streamName: "wajlc-room-stream"

insights:
  enabled: true
  maxTranscriptionLangs: 2
  maxChatTransLangs: 5
  contextWindow: 5
  services:
    ai_text_chat:
      provider: google
      id: "gemini-account-1"
      options:
        chat_model: "gemini-pro"
        summarize_model: "gemini-pro"
      pricing:
        "gemini-pro":
          inputPricePerMillionTokens: 0.5
          outputPricePerMillionTokens: 1.5
    translation:
      provider: azure
      id: "azure-account-1"
      pricing:
        "default":
          pricePerMillionCharacters: 10.0
    speech-synthesis:
      provider: azure
      id: "azure-account-1"
      pricing:
        "default":
          pricePerMillionCharacters: 15.0
    transcription:
      provider: azure
      id: "azure-account-1"
      pricing:
        "default":
          pricePerHour: 1.0
  providers:
    google:
      - id: "gemini-account-1"
        credentials:
          apiKey: "YOUR_GEMINI_API_KEY"
    azure:
      - id: "azure-account-1"
        credentials:
          apiKey: "YOUR_AZURE_API_KEY"
          region: "eastus"
        options:
          endpoint: "https://api.cognitive.microsofttranslator.com/"

thirdParty:
  gemini:
    apiKey: "YOUR_GEMINI_API_KEY"
  # ... other third party configs
