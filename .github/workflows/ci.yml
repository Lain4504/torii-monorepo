name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    name: Build & Lint (Turbo)
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      # We just use a dummy DB URL for build/generation if needed, 
      # though we should mock this properly if tests run against it.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo Build & Lint
        # Turbo will figure out what changed and run lint/build for those packages.
        # --filter=...[origin/main] builds changed packages and their dependents compared to main.
        # If run on main, we might want to run everything or check against previous commit.
        # But for simplicity, we let Turbo handle the graph.
        # For PRs, comparing to target branch (usually main) is best.
        run: |
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run build lint --filter=...[origin/${{ github.base_ref || 'main' }}]
            else
              # On push to main, we might want to run everything or just since last commit.
              # Running everything ensures full correctness on the trunk.
              pnpm turbo run build lint
            fi

